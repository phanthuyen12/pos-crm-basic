<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thanh toán thành công - POS App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
  <style>
    .success-page { min-height: 100vh; padding: 32px 16px; }
    .success-shell { max-width: 720px; margin: 0 auto; }
    .success-card { background: #fff; border: 1px solid #e1e8ef; border-radius: 8px; box-shadow: 0 8px 28px rgba(16, 42, 67, .08); }
    .success-mark { width: 72px; height: 72px; display: grid; place-items: center; margin: 0 auto 16px; border-radius: 50%; color: #fff; background: #1aa35f; font-size: 2rem; }
    .receipt-line + .receipt-line { border-top: 1px dashed #dce4eb; }
    @media print {
      body, .success-page { background: #fff !important; padding: 0 !important; }
      .success-card { box-shadow: none; border: 0; }
      .no-print { display: none !important; }
      .success-shell { max-width: 100%; }
    }
  </style>
</head>
<body>
  <main class="success-page">
    <div class="success-shell">
      <section class="success-card p-4 p-md-5">
        <div class="text-center mb-4 no-print">
          <div class="success-mark"><i class="bi bi-check-lg"></i></div>
          <h1 class="h3 fw-bold">Thanh toán thành công</h1>
          <p class="text-muted">Đơn hàng đã được lưu vào hệ thống.</p>
        </div>
        <div id="receiptContent">
          <div class="text-center py-4 text-muted">Đang tải hóa đơn...</div>
        </div>
        <div id="receiptError" class="alert alert-danger d-none no-print"></div>
        <div class="d-flex flex-wrap gap-2 justify-content-center mt-4 no-print">
          <button id="printReceiptBtn" class="btn btn-brand"><i class="bi bi-printer me-1"></i>In hóa đơn</button>
          <a href="/client/pos.html" class="btn btn-outline-brand"><i class="bi bi-cart-plus me-1"></i>Đơn hàng mới</a>
          <a href="/admin/orders.html" id="adminOrdersLink" class="btn btn-outline-secondary d-none"><i class="bi bi-receipt me-1"></i>Xem trong Admin</a>
        </div>
      </section>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/payment-success.js"></script>
</body>
</html>

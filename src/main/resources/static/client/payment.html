<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thanh toán - POS App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
  <style>
    .payment-page { min-height: 100vh; padding: 32px 16px; }
    .payment-shell { max-width: 960px; margin: 0 auto; }
    .payment-card { background: #fff; border: 1px solid #e1e8ef; border-radius: 8px; box-shadow: 0 8px 28px rgba(16, 42, 67, .08); }
    .payment-method-option { display: flex; align-items: center; gap: 12px; border: 1px solid #dbe4ec; border-radius: 6px; padding: 14px; cursor: pointer; }
    .payment-method-option:has(input:checked) { border-color: var(--brand); background: var(--brand-50); }
    .payment-item + .payment-item { border-top: 1px solid #edf1f5; }
  </style>
</head>
<body>
  <main class="payment-page">
    <div class="payment-shell">
      <button type="button" id="backToCartBtn" class="btn btn-link p-0 text-brand fw-semibold"><i class="bi bi-arrow-left me-1"></i>Quay lại giỏ hàng</button>
      <div class="d-flex align-items-center gap-3 my-4">
        <div class="new-order-icon"><i class="bi bi-credit-card-2-front"></i></div>
        <div><h1 class="h3 fw-bold mb-1">Thanh toán đơn hàng</h1><p class="text-muted mb-0">Kiểm tra thông tin và chọn phương thức thanh toán.</p></div>
      </div>

      <div class="row g-4">
        <section class="col-lg-7">
          <div class="payment-card p-4 mb-4">
            <h2 class="h6 fw-bold mb-3">Phương thức thanh toán</h2>
            <div class="d-grid gap-2">
              <label class="payment-method-option"><input class="form-check-input" type="radio" name="paymentMethod" value="CASH" checked /><i class="bi bi-cash-coin fs-4 text-success"></i><span><strong class="d-block">Tiền mặt</strong><small class="text-muted">Thanh toán tại quầy</small></span></label>
              <label class="payment-method-option"><input class="form-check-input" type="radio" name="paymentMethod" value="CARD" /><i class="bi bi-credit-card fs-4 text-primary"></i><span><strong class="d-block">Thẻ ngân hàng</strong><small class="text-muted">POS/thẻ nội địa hoặc quốc tế</small></span></label>
              <label class="payment-method-option"><input class="form-check-input" type="radio" name="paymentMethod" value="QR" /><i class="bi bi-qr-code fs-4 text-dark"></i><span><strong class="d-block">QR Code</strong><small class="text-muted">Quét mã để thanh toán</small></span></label>
            </div>
          </div>
          <div class="payment-card p-4">
            <h2 class="h6 fw-bold mb-3">Thông tin đơn hàng</h2>
            <div class="d-flex justify-content-between mb-2"><span class="text-muted">Mã đơn tạm</span><strong id="orderPreview">-</strong></div>
            <div class="d-flex justify-content-between"><span class="text-muted">Khách hàng</span><strong id="customerName">Khách lẻ</strong></div>
            <div class="mt-3" id="paymentItems"></div>
          </div>
        </section>

        <aside class="col-lg-5">
          <div class="payment-card p-4">
            <h2 class="h6 fw-bold mb-3">Tóm tắt thanh toán</h2>
            <div class="d-flex justify-content-between mb-2"><span>Tạm tính</span><span id="subtotal">0₫</span></div>
            <div class="d-flex justify-content-between mb-2"><span>Voucher <span id="voucherCode" class="text-muted"></span></span><span id="discount">0₫</span></div>
            <div class="d-flex justify-content-between mb-3"><span>Thuế VAT (8%)</span><span id="tax">0₫</span></div>
            <hr />
            <div class="d-flex justify-content-between fs-5 fw-bold mb-4"><span>Tổng thanh toán</span><span id="total">0₫</span></div>
            <div id="paymentError" class="alert alert-danger d-none" role="alert"></div>
            <button type="button" class="btn btn-success btn-lg w-100 fw-semibold" id="confirmPaymentBtn">
              <span class="pay-label"><i class="bi bi-lock-fill me-1"></i>Xác nhận thanh toán</span>
              <span class="pay-loading d-none"><span class="spinner-border spinner-border-sm me-1"></span>Đang xử lý...</span>
            </button>
            <p class="small text-muted text-center mt-3 mb-0"><i class="bi bi-shield-check me-1"></i>Đơn chỉ được ghi nhận sau khi xác nhận thanh toán.</p>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/payment.js"></script>
</body>
</html>

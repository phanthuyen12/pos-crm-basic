<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sản phẩm - POS App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>

  <div id="layout-sidebar"></div>

  <div class="app-main">
    <div id="layout-topbar"></div>

    <main class="page-content">

      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div class="d-flex gap-2 flex-wrap">
          <select class="form-select form-select-sm w-auto">
            <option>Tất cả danh mục</option>
            <option>Đồ uống</option>
            <option>Thức ăn</option>
            <option>Tráng miệng</option>
            <option>Ăn vặt</option>
          </select>
          <select class="form-select form-select-sm w-auto">
            <option>Tất cả trạng thái</option>
            <option>Đang bán</option>
            <option>Hết hàng</option>
          </select>
        </div>
        <button class="btn btn-brand" data-bs-toggle="modal" data-bs-target="#productModal">
          <i class="bi bi-plus-lg me-1"></i> Thêm sản phẩm
        </button>
      </div>

      <div class="table-card">
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead>
              <tr>
                <th><input type="checkbox" class="form-check-input" /></th>
                <th>Sản phẩm</th>
                <th>Danh mục</th>
                <th>Giá bán</th>
                <th>Kho</th>
                <th>Trạng thái</th>
                <th class="text-end">Hành động</th>
              </tr>
            </thead>
            <tbody id="productTableBody">
              <!-- rendered by admin.js -->
            </tbody>
          </table>
        </div>
        <div class="d-flex justify-content-between align-items-center p-3">
          <small class="text-muted">Hiển thị 1-5 trong 214 sản phẩm</small>
          <nav>
            <ul class="pagination pagination-sm mb-0">
              <li class="page-item disabled"><a class="page-link" href="#">Trước</a></li>
              <li class="page-item active"><a class="page-link" href="#">1</a></li>
              <li class="page-item"><a class="page-link" href="#">2</a></li>
              <li class="page-item"><a class="page-link" href="#">3</a></li>
              <li class="page-item"><a class="page-link" href="#">Sau</a></li>
            </ul>
          </nav>
        </div>
      </div>

    </main>
  </div>

  <!-- Product Modal -->
  <div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Thêm sản phẩm</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="productForm">
            <input type="hidden" id="productId" />
            <div class="mb-3 text-center">
              <div class="mx-auto d-flex align-items-center justify-content-center bg-brand-soft text-brand rounded-3" style="width:90px;height:90px;font-size:2rem;">
                <i class="bi bi-image"></i>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Tên sản phẩm</label>
              <input type="text" id="productName" class="form-control" placeholder="VD: Cà phê sữa đá" />
            </div>
            <div class="row g-3 mb-3">
              <div class="col-6">
                <label class="form-label small fw-semibold">Danh mục</label>
                <select id="productCategory" class="form-select">
                  <option value="">Chọn danh mục</option>
                </select>
              </div>
              <div class="col-6">
                <label class="form-label small fw-semibold">Trạng thái</label>
                <select id="productStatus" class="form-select">
                  <option value="ACTIVE">Đang bán</option>
                  <option value="INACTIVE">Ngừng bán</option>
                </select>
              </div>
            </div>
            <div class="row g-3">
              <div class="col-6">
                <label class="form-label small fw-semibold">Giá bán</label>
                <input type="number" id="productPrice" class="form-control" placeholder="25000" />
              </div>
              <div class="col-6">
                <label class="form-label small fw-semibold">Số lượng kho</label>
                <input type="number" id="productStock" class="form-control" placeholder="100" />
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy</button>
          <button type="button" class="btn btn-brand" id="saveProductBtn">Lưu sản phẩm</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/admin-products.js"></script>
  <script>
    window.PAGE_TITLE = "Sản phẩm";
    initLayout("admin").then(initAdminProducts);
  </script>
</body>
</html>

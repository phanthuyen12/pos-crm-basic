<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nhân viên - POS App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>

  <div id="layout-sidebar"></div>

  <div class="app-main">
    <div id="layout-topbar"></div>

    <main class="page-content">

      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div class="d-flex gap-2 flex-wrap">
          <select class="form-select form-select-sm w-auto">
            <option>Tất cả chức vụ</option>
            <option>Quản lý</option>
            <option>Thu ngân</option>
            <option>Phục vụ</option>
            <option>Bếp</option>
          </select>
          <select class="form-select form-select-sm w-auto">
            <option>Tất cả trạng thái</option>
            <option>Đang làm</option>
            <option>Nghỉ việc</option>
          </select>
        </div>
        <button class="btn btn-brand" data-bs-toggle="modal" data-bs-target="#employeeModal">
          <i class="bi bi-person-plus me-1"></i> Thêm nhân viên
        </button>
      </div>

      <div class="table-card">
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead>
              <tr>
                <th>Mã NV</th>
                <th>Họ tên</th>
                <th>Chức vụ</th>
                <th>Số điện thoại</th>
                <th>Ngày vào làm</th>
                <th>Trạng thái</th>
                <th class="text-end">Hành động</th>
              </tr>
            </thead>
            <tbody id="employeeTableBody">
              <!-- rendered by admin-employees.js -->
            </tbody>
          </table>
        </div>
        <div class="d-flex justify-content-between align-items-center p-3">
          <small class="text-muted">Hiển thị 1-5 trong 5 nhân viên</small>
          <nav>
            <ul class="pagination pagination-sm mb-0">
              <li class="page-item disabled"><a class="page-link" href="#">Trước</a></li>
              <li class="page-item active"><a class="page-link" href="#">1</a></li>
              <li class="page-item"><a class="page-link" href="#">Sau</a></li>
            </ul>
          </nav>
        </div>
      </div>

    </main>
  </div>

  <!-- Employee Modal -->
  <div class="modal fade" id="employeeModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Thêm nhân viên</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="employeeForm">
            <input type="hidden" id="employeeId" />
            <div class="mb-3">
              <label class="form-label small fw-semibold">Họ và tên</label>
              <input type="text" id="employeeName" class="form-control" placeholder="VD: Nguyễn Văn An" />
            </div>
            <div class="row g-3 mb-3">
              <div class="col-6">
                <label class="form-label small fw-semibold">Số điện thoại</label>
                <input type="tel" id="employeePhone" class="form-control" placeholder="09xxxxxxxx" />
              </div>
              <div class="col-6">
                <label class="form-label small fw-semibold">Chức vụ</label>
                <select id="employeeRole" class="form-select">
                  <option value="MANAGER">Quản lý</option>
                  <option value="CASHIER">Thu ngân</option>
                  <option value="WAITER">Phục vụ</option>
                  <option value="KITCHEN">Bếp</option>
                </select>
              </div>
            </div>
            <div class="row g-3">
              <div class="col-6">
                <label class="form-label small fw-semibold">Ngày vào làm</label>
                <input type="date" id="employeeHireDate" class="form-control" />
              </div>
              <div class="col-6">
                <label class="form-label small fw-semibold">Trạng thái</label>
                <select id="employeeStatus" class="form-select">
                  <option value="ACTIVE">Đang làm</option>
                  <option value="INACTIVE">Nghỉ việc</option>
                </select>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy</button>
          <button type="button" class="btn btn-brand" id="saveEmployeeBtn">Lưu nhân viên</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/admin-employees.js"></script>
  <script>
    window.PAGE_TITLE = "Nhân viên";
    initLayout("admin").then(initAdminEmployees);
  </script>
</body>
</html>

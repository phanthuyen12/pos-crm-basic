<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tồn kho - POS App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>

  <div id="layout-sidebar"></div>

  <div class="app-main">
    <div id="layout-topbar"></div>

    <main class="page-content">

      <div class="row g-3 mb-3">
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="stat-card">
            <div class="stat-icon icon-blue"><i class="bi bi-boxes"></i></div>
            <div>
              <p class="stat-value" id="statTracking">0</p>
              <p class="stat-label">Mặt hàng đang theo dõi</p>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="stat-card accent-amber">
            <div class="stat-icon icon-amber"><i class="bi bi-exclamation-triangle"></i></div>
            <div>
              <p class="stat-value" id="statLow">0</p>
              <p class="stat-label">Sắp hết hàng</p>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="stat-card accent-rose">
            <div class="stat-icon icon-rose"><i class="bi bi-x-octagon"></i></div>
            <div>
              <p class="stat-value" id="statOut">0</p>
              <p class="stat-label">Đã hết hàng</p>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="stat-card accent-teal">
            <div class="stat-icon icon-teal"><i class="bi bi-truck"></i></div>
            <div>
              <p class="stat-value" id="statStockIn">0</p>
              <p class="stat-label">Lượt nhập trong tháng</p>
            </div>
          </div>
        </div>
      </div>

      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div class="d-flex gap-2 flex-wrap">
          <select class="form-select form-select-sm w-auto">
            <option>Tất cả danh mục</option>
            <option>Đồ uống</option>
            <option>Thức ăn</option>
            <option>Tráng miệng</option>
            <option>Ăn vặt</option>
          </select>
          <select class="form-select form-select-sm w-auto">
            <option>Tất cả trạng thái</option>
            <option>Còn hàng</option>
            <option>Sắp hết</option>
            <option>Hết hàng</option>
          </select>
        </div>
        <button class="btn btn-brand" data-bs-toggle="modal" data-bs-target="#stockInModal">
          <i class="bi bi-box-arrow-in-down me-1"></i> Nhập kho
        </button>
      </div>

      <div class="table-card mb-4">
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead>
              <tr>
                <th>Sản phẩm</th>
                <th>Danh mục</th>
                <th>Tồn kho</th>
                <th>Ngưỡng cảnh báo</th>
                <th>Trạng thái</th>
                <th class="text-end">Hành động</th>
              </tr>
            </thead>
            <tbody id="stockTableBody">
              <!-- rendered by admin-inventory.js -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Stock-in history -->
      <div class="table-card">
        <div class="p-3 pb-0">
          <h6 class="fw-bold mb-0">Lịch sử nhập kho gần đây</h6>
        </div>
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead>
              <tr>
                <th>Ngày nhập</th>
                <th>Sản phẩm</th>
                <th>Số lượng</th>
                <th>Nhà cung cấp</th>
                <th>Người nhập</th>
              </tr>
            </thead>
            <tbody id="historyTableBody">
              <!-- rendered by admin-inventory.js -->
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- Stock-in modal -->
  <div class="modal fade" id="stockInModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Nhập kho</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="stockForm">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Sản phẩm</label>
              <select id="stockProduct" class="form-select"></select>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Loại phiếu</label>
              <select id="stockType" class="form-select">
                <option value="IN">Nhập kho</option>
                <option value="OUT">Xuất kho</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Số lượng</label>
              <input type="number" id="stockQty" class="form-control" placeholder="50" min="1" />
            </div>
            <div class="row g-3 mb-3">
              <div class="col-6">
                <label class="form-label small fw-semibold">Nhà cung cấp</label>
                <input type="text" id="stockSupplier" class="form-control" placeholder="VD: Công ty TNHH Cà phê Việt" />
              </div>
              <div class="col-6">
                <label class="form-label small fw-semibold">Người thực hiện</label>
                <select id="stockEmp" class="form-select"></select>
              </div>
            </div>
            <div class="mb-1">
              <label class="form-label small fw-semibold">Ghi chú</label>
              <textarea id="stockNote" class="form-control" rows="2" placeholder="Ghi chú thêm (không bắt buộc)"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy</button>
          <button type="button" class="btn btn-brand" id="saveStockBtn">Lưu phiếu</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/admin-inventory.js"></script>
  <script>
    window.PAGE_TITLE = "Tồn kho";
    initLayout("admin").then(initAdminInventory);
  </script>
</body>
</html>

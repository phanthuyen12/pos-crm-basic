<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Báo cáo - POS App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>

  <div id="layout-sidebar"></div>

  <div class="app-main">
    <div id="layout-topbar"></div>

    <main class="page-content">

      <!-- Filters -->
      <div class="card p-3 mb-3">
        <div class="row g-2 align-items-end">
          <div class="col-6 col-md-2">
            <label class="form-label small fw-semibold mb-1">Từ ngày</label>
            <input type="date" class="form-control form-control-sm" value="2026-10-10" />
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label small fw-semibold mb-1">Đến ngày</label>
            <input type="date" class="form-control form-control-sm" value="2026-10-16" />
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label small fw-semibold mb-1">Ca làm việc</label>
            <select class="form-select form-select-sm">
              <option>Tất cả ca</option>
              <option>Ca sáng</option>
              <option>Ca chiều</option>
              <option>Ca tối</option>
            </select>
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label small fw-semibold mb-1">Nhân viên</label>
            <select class="form-select form-select-sm">
              <option>Tất cả nhân viên</option>
              <option>Nguyễn Văn An</option>
              <option>Trần Thị Bích</option>
              <option>Lê Văn Cường</option>
              <option>Võ Minh Em</option>
            </select>
          </div>
          <div class="col-12 col-md-3 d-flex gap-2">
            <button class="btn btn-brand btn-sm flex-fill"><i class="bi bi-filter-circle me-1"></i>Lọc báo cáo</button>
            <button class="btn btn-outline-secondary btn-sm"><i class="bi bi-download"></i></button>
          </div>
        </div>
      </div>

      <!-- KPI -->
      <div class="row g-3 mb-3">
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="stat-card">
            <div class="stat-icon icon-blue"><i class="bi bi-cash-coin"></i></div>
            <div>
              <p class="stat-value" id="kpiRevenue">0₫</p>
              <p class="stat-label">Tổng doanh thu</p>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="stat-card accent-amber">
            <div class="stat-icon icon-amber"><i class="bi bi-receipt"></i></div>
            <div>
              <p class="stat-value" id="kpiOrders">0</p>
              <p class="stat-label">Tổng số đơn</p>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="stat-card accent-teal">
            <div class="stat-icon icon-teal"><i class="bi bi-graph-up"></i></div>
            <div>
              <p class="stat-value" id="kpiAvg">0₫</p>
              <p class="stat-label">Giá trị TB / đơn</p>
            </div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="stat-card accent-rose">
            <div class="stat-icon icon-rose"><i class="bi bi-person-badge"></i></div>
            <div>
              <p class="stat-value" id="kpiEmployees">0</p>
              <p class="stat-label">Nhân viên hoạt động</p>
            </div>
          </div>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-lg-8">
          <div class="card p-3 h-100">
            <h6 class="fw-bold mb-3">Doanh thu theo ngày</h6>
            <canvas id="reportChart" height="110"></canvas>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="card p-3 h-100">
            <h6 class="fw-bold mb-3">Doanh thu theo ca</h6>
            <canvas id="shiftChart" height="140"></canvas>
          </div>
        </div>
      </div>

      <!-- Breakdown by employee -->
      <div class="table-card">
        <div class="p-3 pb-0">
          <h6 class="fw-bold mb-0">Hiệu suất theo nhân viên</h6>
        </div>
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead>
              <tr>
                <th>Nhân viên</th>
                <th>Ca làm chính</th>
                <th>Số đơn</th>
                <th>Doanh thu</th>
                <th>Giá trị TB / đơn</th>
              </tr>
            </thead>
            <tbody id="empPerfTableBody">
              <!-- rendered by admin-reports.js -->
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/admin-reports.js"></script>
  <script>
    window.PAGE_TITLE = "Báo cáo";
    initLayout("admin").then(initAdminReports);
  </script>
</body>
</html>

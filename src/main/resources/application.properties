spring.application.name=demo

# --- Database (MySQL) ---
# Tao database truoc khi migrate: CREATE DATABASE postapp CHARACTER SET utf8mb4;
spring.datasource.url=jdbc:mysql://localhost:3306/postapp?useSSL=false&serverTimezone=UTC
spring.datasource.username=admin
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:migration
spring.flyway.baseline-on-migrate=true

# --- JPA / Hibernate ---
# Flyway owns the schema. ddl-auto=none means Hibernate never creates, alters
# or validates tables on startup — it only uses the entities to generate SQL
# at runtime. ("validate" is stricter but can false-positive against native
# MySQL ENUM columns, so none is the safer default here.)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
